send_command:
  name: Send command (URL params)
  description: 'Send key/value parameters as a URL query string to the device''s http-write.json endpoint.
    Works only on models that accept plain query-string commands. Most encrypted models expect send_raw_command
    instead.

    '
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    params:
      name: Parameters
      description: Map of query parameters to send to the device.
      required: true
      example:
        WashProgr: 13
        Temp: 40
        WiFiStatus: 1
      selector:
        object: null
send_raw_command:
  name: Send raw (pre-encrypted) command
  description: Send a pre-encrypted hex blob as the data parameter. Use the configured key for the same
    appliance; reinstalling the integration does not generate a new device key.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    data:
      name: Hex data
      description: Pre-encrypted command, hex-encoded (no `0x` prefix).
      required: true
      example: 3F150810065C5F423F153B185E5E45270D0B2C005E5148341E2F055151
      selector:
        text: null
send_plaintext_command:
  name: Send plaintext command (auto-encrypts)
  description: Send the captured plaintext with the configured device encoding (encrypted, hex-only or
    plain).
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    plaintext:
      name: Plaintext command
      description: The plaintext command string to encrypt and send.
      required: true
      example: Write=1&Pa=1
      selector:
        text: null
washing_machine_start:
  name: Washing machine — Start program
  description: 'Build and send a START command for a Candy washing machine. Wraps the plaintext format
    Write=1&Pa=0&Sel=0&PrNm=N&StSt=1&...&Stm=0&RecipeId=0&CheckUpState=0 and encrypts it with the configured
    device key.

    '
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    program:
      name: Program number (PrNm)
      description: The program number to start (1..N depending on model).
      required: true
      example: 13
      selector:
        number:
          min: 0
          max: 30
          mode: box
    temp:
      name: Target temperature (TmpTgt)
      description: Optional. Wash temperature in °C.
      example: 40
      selector:
        number:
          min: 0
          max: 90
          mode: box
    spin_target:
      name: Spin target (SpdTgt)
      description: Optional. Target spin speed index (e.g. 15).
      example: 15
      selector:
        number:
          min: 0
          max: 20
          mode: box
    spin_default:
      name: Spin default (SpdDef)
      description: Optional. Default spin speed index.
      example: 10
      selector:
        number:
          min: 0
          max: 20
          mode: box
    soil_level:
      name: Soil level (SLevTgt)
      example: 2
      selector:
        number:
          min: 0
          max: 5
          mode: box
    steam:
      name: Steam (Stm)
      description: 0 = off, 1 = low, 2 = high.
      default: 0
      selector:
        number:
          min: 0
          max: 2
          mode: box
washing_machine_stop:
  name: Washing machine — Stop program
  description: 'Build and send a STOP command. If `program` is omitted, the current program number is
    taken from the device''s last known status. Plaintext: Write=1&StSt=0&DelMd=0&PrNm=N

    '
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    program:
      name: Program number
      description: Optional override; defaults to the current program.
      selector:
        number:
          min: 0
          max: 30
          mode: box
washing_machine_pause:
  name: Washing machine — Pause
  description: Sends Write=1&Pa=1. Best-effort; not yet verified on every model.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
washing_machine_resume:
  name: Washing machine — Resume
  description: Sends Write=1&Pa=0. Best-effort.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
tumble_dryer_start:
  name: Tumble dryer — Start program
  description: "Send a verified START command to a Candy tumble dryer. Plaintext format (verified from\
    \ captured Simply-Fi app commands):\n  Write=1&PrNm=N&Time=T&OptMsk=M&RecipeId=0&PrStr=&StSt=1\nUse\
    \ the \"Start tumble dryer\" button entity for a better experience — it picks up Time/OptMsk/PrStr\
    \ automatically from the selected program.\n"
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    program:
      name: Program number (PrNm)
      description: Selector position from the Simply-Fi backend (1..15 for CSO H8A2DE-S).
      required: true
      example: 1
      selector:
        number:
          min: 0
          max: 30
          mode: box
tumble_dryer_stop:
  name: Tumble dryer — Stop (EXPERIMENTAL)
  description: Send Write=1&StSt=0&PrNm=N. If omitted, the program is taken from the last reported status.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    program:
      name: Program
      description: Optional override; defaults to the current program.
      selector:
        number:
          min: 0
          max: 30
          mode: box
tumble_dryer_pause:
  name: Tumble dryer — Pause (EXPERIMENTAL)
  description: Sends Write=1&Pa=1. Best-effort.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
tumble_dryer_resume:
  name: Tumble dryer — Resume (EXPERIMENTAL)
  description: Sends Write=1&Pa=0. Best-effort.
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
decrypt_data:
  name: Decrypt captured hex blob
  description: 'XOR-decrypt the given hex blob with the configured device key and log the plaintext at
    warning level (visible in the Home Assistant log). Helpful for learning your device''s plaintext command
    format from a captured blob.

    '
  fields:
    device_id:
      name: Candy device
      description: Select the appliance to control. Existing YAML targets remain supported.
      required: true
      selector:
        device:
          filter:
          - integration: candy
    data:
      name: Hex data
      description: Encrypted command, hex-encoded.
      required: true
      example: 3F150810065C5F423F153B185E5E45270D0B2C005E5148341E2F055151
      selector:
        text: null
