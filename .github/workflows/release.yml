name: Publish release
on:
  push:
    branches: [main]
    paths: [custom_components/candy/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_test.txt
      - run: python -m unittest discover -s checks -v
      - run: python -m pytest tests --asyncio-mode=auto -q
      - name: Build installable integration archive
        run: |
          python -m compileall -q custom_components/candy
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('custom_components/candy')
          version = json.loads((root / 'manifest.json').read_text())['version']
          with ZipFile('candy.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts:
                      archive.write(path, path.relative_to('custom_components'))
          Path('release-version.txt').write_text(version)
          PY
      - name: Publish version for HACS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat release-version.txt)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$version" candy.zip \
            --target "$GITHUB_SHA" \
            --title "Candy Simply-Fi v$version" \
            --notes-file "release-notes/$version.md"
